name: Import chat app source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-chat-app.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vexa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/email1fje-dev/discord-clone.git /tmp/vexa-source
          mkdir -p frontend backend
          rsync -a --delete --exclude='.env' --exclude='.env.*' --exclude='src/vexa-theme.scss' /tmp/vexa-source/frontend/ frontend/
          rsync -a --delete --exclude='.env' --exclude='.env.*' /tmp/vexa-source/backend/ backend/
          printf 'API_URL=http://localhost:4000\n' > frontend/.env.example
          cat > backend/.env.example <<'EOF'
          PORT=4000
          FRONTEND_URL=http://localhost:3000
          MONGODB_URL=mongodb://127.0.0.1:27017/vexa
          JWT_SECRET=replace-with-a-long-random-secret
          JWT_ACCESS_EXPIRATION_MINUTES=30
          JWT_REFRESH_EXPIRATION_DAYS=30
          JWT_RESET_PASSWORD_TOKEN_EXPIRATION_MINUTES=10
          JWT_VERIFY_EMAIL_TOKEN_EXPIRATION_MINUTES=10
          REDIS_HOST=redis://127.0.0.1:6379
          EOF
          cp /tmp/vexa-source/LICENSE SOURCE_LICENSE.md
          cp /tmp/vexa-source/README.md SOURCE_README.md
          printf '\n\n@import "./vexa-theme.scss";\n' >> frontend/src/app.styles.scss
          cat > frontend/src/vexa-theme.scss <<'EOF'
          :root {
            --vexa-green: #22c55e;
            --vexa-green-strong: #16a34a;
            --vexa-green-soft: #86efac;
            --vexa-black: #090d0b;
            --vexa-panel: #111915;
            --vexa-panel-raised: #18231c;
            --vexa-border: #26382c;
            --vexa-text: #ecfdf3;
            --vexa-muted: #9fb5a5;
          }
          .channels--scrollbar::-webkit-scrollbar-track,
          .main--chat--scrollbar::-webkit-scrollbar-track,
          .sidebar--users--scrollbar::-webkit-scrollbar-track,
          .channels--scrollbar::-webkit-scrollbar,
          .main--chat--scrollbar::-webkit-scrollbar,
          .sidebar--users--scrollbar::-webkit-scrollbar {
            background-color: var(--vexa-panel);
          }
          .channels--scrollbar::-webkit-scrollbar-thumb,
          .main--chat--scrollbar::-webkit-scrollbar-thumb,
          .sidebar--users--scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--vexa-border);
          }
          html[data-vexa-theme="light"] {
            --vexa-black: #f5fbf6;
            --vexa-panel: #ffffff;
            --vexa-panel-raised: #eaf7ed;
            --vexa-border: #c7e6cf;
            --vexa-text: #102217;
            --vexa-muted: #476453;
          }
          body { scrollbar-color: var(--vexa-border) var(--vexa-panel); }
          EOF
          cat > VEXA_INTEGRATION.md <<'EOF'
          # Vexa chat app integration
          The original React frontend and Node/Express backend are imported under frontend/ and backend/.
          The existing root index.html and app.html are preserved.
          ## Run locally
          Start MongoDB and Redis. Copy backend/.env.example to backend/.env, replace JWT_SECRET, and configure services. In backend/, install dependencies and run npm run dev. In frontend/, create .env containing API_URL=http://localhost:4000, install dependencies, and run npm start.
          Importing source does not host the backend automatically; deploy it and configure production service URLs before production use.
          EOF
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend SOURCE_LICENSE.md SOURCE_README.md VEXA_INTEGRATION.md
          git commit -m "Import complete React frontend and Node backend"
          git push origin HEAD:main
