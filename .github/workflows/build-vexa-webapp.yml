name: Build Vexa Web App

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-vexa-webapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vexa-webapp-build
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Build the actual tracked frontend source
        id: build-webapp
        continue-on-error: true
        working-directory: frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -euo pipefail
          exec > >(tee /tmp/vexa-build.log) 2>&1
          yarn install --frozen-lockfile --network-timeout 120000
          yarn build
          test -f build/index.html
          test -d build/js
      - name: Publish generated production files
        if: steps.build-webapp.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf webapp/js webapp/styles webapp/assets webapp/index.html webapp/vexa-overrides.css webapp/favicon.png
          mkdir -p webapp
          cp -a frontend/build/. webapp/
          find webapp -type f -name '*.map' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/
          if git diff --cached --quiet; then
            echo "Production files are already up to date."
          else
            git commit -m "Build Vexa web app from frontend source"
            git push origin HEAD:main
          fi
      - name: Save build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "# وضعیت ساخت وب‌اپ Vexa"
            echo
            echo "نتیجه‌ی مرحله‌ی ساخت: ${{ steps.build-webapp.outcome }}"
            echo
            echo "این ساخت از سورس ثبت‌شده در پوشه‌ی frontend انجام می‌شود؛ ZIP اصلی دست‌نخورده می‌ماند."
            echo
            echo "## انتهای گزارش ساخت"
            echo '```text'
            if [ -f /tmp/vexa-build.log ]; then tail -n 100 /tmp/vexa-build.log; else echo 'گزارش ساخت تولید نشد.'; fi
            echo '```'
          } > BUILD-STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD-STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Vexa web app build status"
            git push origin HEAD:main
          fi
      - name: Fail if production build did not complete
        if: steps.build-webapp.outcome == 'failure'
        run: exit 1
