name: Repair Vexa web app bundle

on:
  push:
    branches: [main]
    paths:
      - 'discord-clone-main (1).zip'
      - '.github/workflows/repair-webapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Vexa
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s 'discord-clone-main (1).zip'
          mkdir -p /tmp/vexa-source
          unzip -q 'discord-clone-main (1).zip' -d /tmp/vexa-source
          test -f /tmp/vexa-source/discord-clone-main/frontend/package.json
          test -f /tmp/vexa-source/discord-clone-main/frontend/config/webpack.prod.js
      - name: Install and build frontend
        working-directory: /tmp/vexa-source/discord-clone-main/frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f build/index.html
          test -n "$(find build/js -maxdepth 1 -type f -name 'main.*.bundle.js' -print -quit)"
      - name: Replace broken compiled assets while preserving Vexa customizations
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/vexa-source/discord-clone-main/frontend/build
          mkdir -p webapp/js webapp/styles
          cp -f "$SRC"/js/*.bundle.js webapp/js/
          cp -f "$SRC"/styles/*.css webapp/styles/
          RUNTIME=$(basename "$(find "$SRC/js" -maxdepth 1 -type f -name 'runtime.*.bundle.js' -print -quit)")
          MAIN=$(basename "$(find "$SRC/js" -maxdepth 1 -type f -name 'main.*.bundle.js' -print -quit)")
          CSS=$(basename "$(find "$SRC/styles" -maxdepth 1 -type f -name 'main.*.css' -print -quit)")
          test -n "$RUNTIME" && test -n "$MAIN" && test -n "$CSS"
          python3 - "$RUNTIME" "$MAIN" "$CSS" <<'PY'
          import pathlib, re, sys
          runtime, main, css = sys.argv[1:]
          p = pathlib.Path('webapp/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\./js/runtime\.[^"\']+\.bundle\.js', './js/' + runtime, s)
          s = re.sub(r'\./js/main\.[^"\']+\.bundle\.js', './js/' + main, s)
          s = re.sub(r'\./(?:styles/)?main\.[^"\']+\.css', './styles/' + css, s)
          p.write_text(s, encoding='utf-8')
          PY
          cp -f "$SRC"/favicon.ico webapp/favicon.ico 2>/dev/null || true
          test -s "webapp/js/$MAIN"
          test -s "webapp/js/$RUNTIME"
          test -s "webapp/styles/$CSS"
      - name: Commit rebuilt app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp/js webapp/styles webapp/index.html webapp/favicon.ico
          if git diff --cached --quiet; then
            echo 'No generated asset changes to commit.'
          else
            git commit -m 'Rebuild broken Vexa web app assets from uploaded source'
            git push
          fi
