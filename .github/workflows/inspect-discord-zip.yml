name: Inspect uploaded Discord clone ZIP

on:
  push:
    paths:
      - ".github/workflows/inspect-discord-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vexa
        uses: actions/checkout@v4
      - name: Inspect archive without replacing Vexa files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="discord-clone-main (1).zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP not found at repository root: $ZIP" > ZIP-INSPECTION.md
          else
            mkdir -p /tmp/vexa-zip-inspect
            unzip -q "$ZIP" -d /tmp/vexa-zip-inspect
            {
              echo "# گزارش بررسی ZIP پروژه Vexa"
              echo
              echo "- فایل آرشیو: $ZIP"
              echo "- حجم: $(du -h "$ZIP" | cut -f1)"
              echo
              echo "## ساختار فایل‌ها (حداکثر 250 مورد)"
              printf '```text\n'
              find /tmp/vexa-zip-inspect -type f -printf '%P\n' | sort | head -n 250
              printf '\n```\n'
              echo
              echo "## فایل‌های package.json"
              find /tmp/vexa-zip-inspect -name package.json -type f -print0 | while IFS= read -r -d '' f; do
                echo
                echo "### ${f#/tmp/vexa-zip-inspect/}"
                node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(JSON.stringify({name:p.name,version:p.version,scripts:p.scripts,dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))}catch(e){console.log("Could not parse package.json: "+e.message)}' "$f"
              done
              echo
              echo "## فایل‌های راهنمای پروژه"
              find /tmp/vexa-zip-inspect -maxdepth 4 -type f \( -iname 'README*' -o -iname 'vite.config.*' -o -iname 'next.config.*' -o -iname 'webpack.config.*' -o -iname 'Dockerfile' \) -printf '%P\n' | sort
              for rel in frontend/.env.production frontend/config/paths.js frontend/config/webpack.prod.js frontend/src/api/client.js frontend/src/api/auth/index.js frontend/public/index.html; do
                f="/tmp/vexa-zip-inspect/discord-clone-main/$rel"
                if [ -f "$f" ]; then
                  echo
                  echo "## SOURCE: $rel"
                  printf '\x60\x60\x60\n'
                  sed -n '1,220p' "$f"
                  printf '\n\x60\x60\x60\n'
                fi
              done
            } > ZIP-INSPECTION.md
          fi
      - name: Save inspection report to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZIP-INSPECTION.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Inspect uploaded Discord clone archive"
            git push
          fi

      - name: Set up Node and Yarn for web app build
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Build and integrate the ZIP frontend
        id: build-webapp
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/vexa-build.log) 2>&1
          FRONTEND="/tmp/vexa-zip-inspect/discord-clone-main/frontend"
          test -f "$FRONTEND/package.json"
          printf 'API_URL=\n' > "$FRONTEND/.env.production"
          sed -i "s|publicPath: '/'|publicPath: './'|g" "$FRONTEND/config/webpack.prod.js" "$FRONTEND/config/webpack.common.js"
          cd "$FRONTEND"
          yarn install --frozen-lockfile --network-timeout 120000
          yarn build
          test -f "$FRONTEND/build/index.html"
          cd "$GITHUB_WORKSPACE"
          cp webapp/index.html /tmp/vexa-original-index.html
          cp -a "$FRONTEND/build/." webapp/
          python3 - <<'PY'
          from pathlib import Path
          import re
          original = Path('/tmp/vexa-original-index.html').read_text(encoding='utf-8')
          built = Path('webapp/index.html').read_text(encoding='utf-8')
          styles = re.findall(r'<link\b(?=[^>]*\brel=[\"\']stylesheet[\"\'])[^>]*>', built, re.I)
          scripts = re.findall(r'<script\b(?=[^>]*\bsrc=)[^>]*>\s*</script>', built, re.I)
          def relative(tag):
              return re.sub(r'((?:href|src)=[\"\'])/(?!/)', r'\1./', tag)
          styles = [relative(tag) for tag in styles]
          scripts = [relative(tag) for tag in scripts]
          if not scripts:
              raise SystemExit('Build output contains no external JavaScript bundles')
          original = re.sub(r'<link\b(?=[^>]*\brel=[\"\']stylesheet[\"\'])[^>]*>', '', original, flags=re.I)
          css = ''.join(styles) + '<link href="./vexa-overrides.css" rel="stylesheet">'
          marker = '<style id="vexa-global-theme">'
          if marker in original:
              original = original.replace(marker, css + marker, 1)
          else:
              original = original.replace('</head>', css + '</head>', 1)
          original = re.sub(r'<script\b(?=[^>]*\bsrc=)[^>]*>\s*</script>', '', original, flags=re.I)
          original = original.replace('</body>', ''.join(scripts) + '</body>')
          Path('webapp/index.html').write_text(original, encoding='utf-8')
          PY
      - name: Commit built web app only
        if: steps.build-webapp.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/
          if ! git diff --cached --quiet; then
            git commit -m "Build Vexa web app from uploaded Discord clone ZIP"
            git push
          fi
      - name: Save build diagnostic report
        if: always()
        run: |
          {
            echo "# Vexa web app build status"
            echo
            echo "Build step outcome: ${{ steps.build-webapp.outcome }}"
            echo
            echo "## Recent build output"
            echo '```text'
            if [ -f /tmp/vexa-build.log ]; then tail -n 120 /tmp/vexa-build.log; else echo 'No build log was produced.'; fi
            echo '```'
          } > BUILD-STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD-STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Vexa web app build status"
            git push
          fi
      - name: Fail if the build failed
        if: steps.build-webapp.outcome == 'failure'
        run: exit 1
