function renderSidebar(){
 const search=$('dm-search');const q=(search?.value||'').toLowerCase().trim();const entries=roomsWithPartners();const unique=new Map();
 entries.forEach(x=>{if(!unique.has(userId(x.user)))unique.set(userId(x.user),x)});
 const list=Array.from(unique.values()).filter(x=>(x.user.username||'').toLowerCase().includes(q)||tag(x.user).toLowerCase().includes(q));
 const root=$('dm-list');if(!root)return;
 let html=list.map(x=>'<button class="dm-row '+(v.view==='chat'&&v.friend&&userId(v.friend)===userId(x.user)?'active':'')+'" data-user-chat="'+esc(userId(x.user))+'">'+av(x.user)+'<span class="dm-copy"><b>'+esc(x.user.username||'کاربر')+'</b><small>'+esc(tag(x.user))+'</small></span></button>').join('');
 const friendsWithoutRoom=v.friends.filter(f=>!unique.has(userId(f.user))&&((f.user.username||'').toLowerCase().includes(q)||tag(f.user).toLowerCase().includes(q)));
 if(friendsWithoutRoom.length){html+='<div class="sidebar-section-heading" style="padding-top:14px"><span>شروع گفتگو</span></div>'+friendsWithoutRoom.map(x=>'<button class="dm-row" data-user-chat="'+esc(userId(x.user))+'">'+av(x.user)+'<span class="dm-copy"><b>'+esc(x.user.username||'کاربر')+'</b><small>شروع پیام مستقیم</small></span></button>').join('')}
 if(!html)html='<div class="empty-state" style="padding:30px 8px"><div class="empty-icon">'+ico('message')+'</div><h3 style="font-size:13px">هنوز گفتگویی نیست</h3><p>از بخش دوستان یک گفتگو را شروع کن.</p><button class="btn primary" style="margin-top:12px" data-nav="friends">دیدن دوستان</button></div>';

function render(){
 const shell=$('app-shell');if(!shell)return;
 shell.classList.toggle('chat-open',v.view==='chat');
 shell.classList.toggle('member-open',v.view==='chat'&&v.memberPanel);
 document.querySelectorAll('[data-nav]').forEach(b=>{const key=b.dataset.nav;const on=(key==='home'&&v.view==='home')||(key==='friends'&&v.view==='friends')||(key==='notifications'&&v.view==='friends'&&v.tab==='pending')||(key==='you'&&v.view==='profile')||(key==='dms'&&(v.view==='dms'||v.view==='chat'))||(key==='servers'&&v.view==='servers');b.classList.toggle('active',on)});
 
 document.querySelectorAll('.mobile-dock [data-nav]').forEach(b=>b.classList.toggle('active',(b.dataset.nav==='home'&&v.view==='home')||(b.dataset.nav==='dms'&&(v.view==='dms'||v.view==='chat'))||(b.dataset.nav==='notifications'&&v.view==='friends'&&v.tab==='pending')||(b.dataset.nav==='you'&&v.view==='profile')));
 renderSidebar();renderMain();
}

function setNav(name){if(name==='home'){v.view='home';v.friend=null;v.room=null;v.messages=[];v.tab='all'}else if(name==='friends'){v.view='friends';v.friend=null;v.room=null;v.messages=[];v.tab='all'}else if(name==='notifications'){v.view='friends';v.friend=null;v.room=null;v.messages=[];v.tab='pending'}else if(name==='you'){v.view='profile';v.profileTab='profile';v.friend=null;v.room=null;v.messages=[]}else if(name==='dms'){v.view='dms';v.friend=null;v.room=null;v.messages=[]}else if(name==='servers'){v.view='servers';v.friend=null;v.room=null;v.messages=[]}render()}

 const messageMarkup=msgItems.map(m=>{const sender=m.senderId&&typeof m.senderId==='object'?m.senderId:null;const myMessage=userId(sender||{id:m.senderId})===userId(st.user);const senderUser=myMessage?st.user:(sender||u);return '<article class="message-row">'+av(senderUser)+'<div class="message-content"><div class="message-heading"><b>'+esc(myMessage?'تو':(senderUser.username||u.username||'کاربر'))+'</b><time>'+esc(m.createdAt?new Date(m.createdAt).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'')+'</time></div><div class="message-text">'+esc(m.message||m.text||'')+'</div></div></article>'}).join('');
 const topWelcome='<div class="chat-welcome">'+av(u,'lg')+'<h2>'+esc(u.username||'کاربر')+'</h2><p>این شروع گفتگوی مستقیم تو با <strong>'+esc(tag(u))+'</strong> است.</p></div>';
 root.innerHTML='<div class="chat-layout"><section class="chat-center"><div class="chat-messages" id="chat-messages">'+(!msgItems.length?topWelcome:'')+messageMarkup+(!v.room?'<div class="empty-state">در حال باز کردن گفتگو…</div>':'')+'</div><div class="chat-input-zone"><form class="chat-composer" id="send-message-form"><button type="button" class="composer-plus" data-action="attachment-info" title="پیوست">'+ico('plus')+'</button><textarea id="message-input" rows="1" placeholder="پیام به '+esc(u.username||'کاربر')+'" '+(!v.room?'disabled':'')+'></textarea><button class="composer-send" type="submit" title="ارسال" '+(!v.room?'disabled':'')+'>'+ico('send')+'</button></form></div></section>'+(v.memberPanel?'<aside class="member-pane"><div style="height:85px;border-radius:8px;background:radial-gradient(circle at 80% 30%,#31c76a70,transparent 35%),linear-gradient(120deg,#151d18,#215e38);margin-bottom:-36px"></div><div style="padding:0 8px 12px">'+av(u,'lg')+'<h2 style="font-size:17px;margin:10px 0 4px">'+esc(u.username||'کاربر')+'</h2><small style="color:var(--muted)" dir="ltr">'+esc(tag(u))+'</small><p style="font-size:11px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere">'+esc(u.bio||'توضیحی برای این کاربر ثبت نشده.')+'</p></div><div class="sidebar-divider"></div><h3>اعضای گفتگو — ۲</h3><div class="member-row">'+av(u)+'<div class="member-copy"><b>'+esc(u.username||'کاربر')+'</b><small>'+shortStatus(u.presenceStatus)+'</small></div></div><div class="member-row">'+av(st.user)+'<div class="member-copy"><b>'+esc(st.user?.username||'تو')+' (تو)</b><small>'+shortStatus(st.user?.presenceStatus)+'</small></div></div></aside>':'')+'</div>';
 const ms=$('chat-messages');if(ms)ms.scrollTop=ms.scrollHeight;
}
async function openDm(u){
 if(!u||!userId(u))return;
 v.friend=u;v.view='chat';v.room=null;v.messages=[];render();
 try{
  const room=await api('/rooms/get-or-create',{method:'POST',body:JSON.stringify({id:userId(u)})});
  v.room=room?.data||room;
  const messages=await api('/messages/'+encodeURIComponent(userId(v.room))+'?limit=100&page=1');
  v.messages=arr(messages).slice().reverse();render();
 }catch(e){v.room=null;render();toast('گفتگو باز نشد: '+e.message)}
}
async function addFriendByName(username,shortId){
 await api('/friends/add-friend-request',{method:'POST',body:JSON.stringify({username,shortId})});v.tab='outgoing';toast('درخواست دوستی ارسال شد');await load();
}
async function saveProfile(form){
 const username=form.querySelector('[name="username"]').value.trim();
 const bio=form.querySelector('[name="bio"]').value.trim();
 const presenceStatus=form.querySelector('[name="presenceStatus"]').value;
 const payload={username,bio,presenceStatus};if(v.pendingAvatar!==null)payload.avatar=v.pendingAvatar;
 const submit=form.querySelector('[type="submit"]');if(submit){submit.disabled=true;submit.textContent='در حال ذخیره…'}
 try{const result=await api('/users/me/profile',{method:'PATCH',body:JSON.stringify(payload)});const updated=result?.data||result;st.user={...st.user,...updated,username,bio,presenceStatus};if(v.pendingAvatar!==null)st.user.avatar=v.pendingAvatar;store.set('vexa_user',JSON.stringify(st.user));v.pendingAvatar=null;closeDialog();render();toast('پروفایل ذخیره شد')}
 catch(e){toast('ذخیرهٔ پروفایل ناموفق بود: '+e.message);if(submit){submit.disabled=false;submit.textContent='ذخیره تغییرات'}}
}
function editProfileDialog(){
 v.pendingAvatar=null;const u=st.user||{};
 openDialog('<div class="dialog-card"><div class="dialog-head"><h2>ویرایش پروفایل</h2><button data-action="close-dialog" title="بستن">'+ico('close')+'</button></div><p>اطلاعاتی که می‌خواهی بقیه در وکسا ببینند، تغییر بده.</p><div class="avatar-edit-row"><span id="avatar-edit-preview">'+av(u,'lg')+'</span><div class="avatar-edit-actions"><button class="btn" type="button" data-action="pick-avatar">تغییر عکس پروفایل</button><button class="btn" type="button" data-action="remove-avatar">حذف عکس</button><input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" class="hidden"><small class="muted">PNG، JPG یا WebP؛ تصویر به اندازهٔ مناسب فشرده می‌شود.</small></div></div><form id="profile-edit-form" class="dialog-form"><div><label>نام کاربری</label><input name="username" required minlength="2" maxlength="32" value="'+esc(u.username||'')+'"></div><div><label>دربارهٔ من</label><textarea name="bio" maxlength="160" placeholder="چند کلمه درباره خودت…">'+esc(u.bio||'')+'</textarea></div><div><label>وضعیت</label><select name="presenceStatus"><option value="online" '+((u.presenceStatus||'online')==='online'?'selected':'')+'>آنلاین</option><option value="idle" '+(u.presenceStatus==='idle'?'selected':'')+'>غیرفعال</option><option value="dnd" '+(u.presenceStatus==='dnd'?'selected':'')+'>مزاحم نشوید</option></select></div><div class="dialog-actions"><button class="btn primary" type="submit">ذخیره تغییرات</button><button class="btn" type="button" data-action="close-dialog">انصراف</button></div></form></div>');
}
function serverNotReadyDialog(kind){
 const title=kind==='join'?'پیوستن به سرور':'ساخت سرور';
 openDialog('<div class="dialog-card"><div class="dialog-head"><h2>'+title+'</h2><button data-action="close-dialog" title="بستن">'+ico('close')+'</button></div><p>داداش، ظاهر بخش سرورها رو آماده کردم؛ اما بک‌اند فعلی وکسا فقط حساب کاربری، دوستی و پیام خصوصی رو پشتیبانی می‌کنه. برای اینکه ساخت سرور واقعی باشه و بین کاربرها ذخیره بشه، باید API و مدل‌های سرور و کانال هم اضافه بشن. این دکمه الان وانمود نمی‌کنه کاری انجام داده.</p><div class="dialog-actions"><button class="btn primary" data-action="close-dialog">متوجه شدم</button></div></div>');
}
function handleClick(event){
 const b=event.target.closest('button,[data-nav],[data-action],[data-tab],[data-user-chat],[data-add-user],[data-accept],[data-cancel-request],[data-profile-section],[data-theme-pick]');if(!b)return;
 if(b.dataset.nav){setNav(b.dataset.nav);return}
 if(b.dataset.tab){v.tab=b.dataset.tab;render();return}
 if(b.dataset.userChat||b.dataset.userChat===''){closeDialog();openDm(findUser(b.dataset.userChat));return}
 if(b.dataset.addUser){const u=findUser(b.dataset.addUser)||v.users.find(x=>userId(x)===b.dataset.addUser);if(!u)return;addFriendByName(u.username,u.shortId).catch(e=>toast(e.message));return}
 if(b.dataset.accept){api('/friends/accept-pending-request',{method:'PATCH',body:JSON.stringify({id:b.dataset.accept})}).then(()=>{toast('درخواست پذیرفته شد');load()}).catch(e=>toast(e.message));return}
 if(b.dataset.cancelRequest){api('/friends/cancel-pending-request',{method:'PATCH',body:JSON.stringify({id:b.dataset.cancelRequest})}).then(()=>{toast('درخواست حذف شد');load()}).catch(e=>toast(e.message));return}
 if(b.dataset.profileSection){v.profileTab=b.dataset.profileSection;render();return}
 if(b.dataset.themePick){document.documentElement.dataset.theme=b.dataset.themePick;store.set('vexa_theme',b.dataset.themePick);render();return}
 const action=b.dataset.action;
 if(action==='theme'){theme();render();return}
 if(action==='profile'){v.view='profile';v.profileTab='profile';render();return}
 if(action==='edit-profile'){editProfileDialog();return}
 if(action==='pick-avatar'){$('avatar-file')?.click();return}
 if(action==='remove-avatar'){v.pendingAvatar='';const p=$('avatar-edit-preview');if(p)p.innerHTML=av({...st.user,avatar:''},'lg');return}
 if(action==='close-dialog'){closeDialog();return}
 if(action==='logout'){logout();return}
 if(action==='refresh'){load().then(()=>toast('اطلاعات تازه شد')).catch(e=>toast(e.message));return}
 if(action==='add-dm'){v.view='friends';v.tab='add';render();return}
 if(action==='back-mobile'){v.view='dms';v.friend=null;v.room=null;v.messages=[];render();return}
 if(action==='toggle-members'){v.memberPanel=!v.memberPanel;render();return}
 if(action==='profile-friend'){if(v.friend)showUserCard(v.friend);return}
 if(action==='friend-more'){const u=findUser(b.dataset.userId);if(u)showUserCard(u);return}
 if(action==='copy-tag'){const t=tag(st.user);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('کد کاربری کپی شد')).catch(()=>toast(t));else toast(t);return}
 if(action==='server-create'){serverNotReadyDialog('create');return}
 if(action==='server-join'){serverNotReadyDialog('join');return}
 if(action==='server-discover'){v.view='serverDiscover';render();return}
 if(action==='sidebar-help'){openDialog('<div class="dialog-card"><div class="dialog-head"><h2>راهنمای وکسا</h2><button data-action="close-dialog">'+ico('close')+'</button></div><p>از «دوستان» برای مدیریت درخواست‌ها، از «پیام‌های مستقیم» برای گفتگوها و از «پروفایل من» برای ویرایش اطلاعات حساب استفاده کن.</p><div class="dialog-actions"><button class="btn primary" data-action="close-dialog">باشه</button></div></div>');return}
 if(action==='attachment-info'){toast('ارسال فایل هنوز به بک‌اند متصل نشده.');return}
 if(action==='toggle-chat-search'){toast('جستجوی پیام‌ها هنوز پیاده‌سازی نشده.');return}
}
function showUserCard(u){
 openDialog('<div class="dialog-card"><div class="dialog-head"><h2>اطلاعات کاربر</h2><button data-action="close-dialog">'+ico('close')+'</button></div><div class="avatar-edit-row">'+av(u,'lg')+'<div><h3 style="margin:0 0 5px">'+esc(u.username||'کاربر')+'</h3><div class="muted" dir="ltr">'+esc(tag(u))+'</div><div style="margin-top:8px">'+statusDot(u.presenceStatus)+' '+shortStatus(u.presenceStatus)+'</div></div></div><div class="settings-panel"><h3>دربارهٔ من</h3><p style="font-size:12px;line-height:1.8;margin:0;color:var(--muted)">'+esc(u.bio||'توضیحی برای این کاربر ثبت نشده.')+'</p></div><div class="dialog-actions"><button class="btn primary" data-user-chat="'+esc(userId(u))+'">'+ico('message')+' پیام دادن</button><button class="btn" data-action="close-dialog">بستن</button></div></div>');
}
async function handleSubmit(event){
 const form=event.target;if(!(form instanceof HTMLFormElement))return;
 if(form.id==='send-message-form'){
  event.preventDefault();const input=$('message-input'),text=input.value.trim();if(!text||!v.room)return;
  const submit=form.querySelector('[type="submit"]');submit.disabled=true;
  try{await api('/messages/send-message',{method:'POST',body:JSON.stringify({roomId:userId(v.room),text})});input.value='';const data=await api('/messages/'+encodeURIComponent(userId(v.room))+'?limit=100&page=1');v.messages=arr(data).slice().reverse();renderChat()}
  catch(e){toast('پیام ارسال نشد: '+e.message)}finally{if(submit)submit.disabled=false}
  return;
 }
 if(form.id==='add-by-tag'){
  event.preventDefault();const raw=$('friend-tag-input').value.trim();const match=raw.match(/^(.+)#(\d{4})$/);if(!match){toast('فرمت کد کاربری باید مثل username#1234 باشد.');return}
  try{await addFriendByName(match[1],match[2]);}catch(e){toast(e.message)}return;
 }
 if(form.id==='profile-edit-form'){event.preventDefault();await saveProfile(form)}
}
function handleInput(event){
 if(event.target.id==='dm-search'){renderSidebar();return}
 if(event.target.id==='directory-search'){const input=event.target;const pos=input.selectionStart;v.directoryQuery=input.value;renderMain();const next=$('directory-search');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}}
}
function imageFileToDataUrl(file){
 return new Promise((resolve,reject)=>{
  if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){reject(new Error('لطفاً یک تصویر PNG، JPG یا WebP انتخاب کن.'));return}
  const reader=new FileReader();reader.onerror=()=>reject(new Error('خواندن عکس ناموفق بود.'));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('این تصویر باز نشد.'));img.onload=()=>{let size=384;const canvas=document.createElement('canvas');const scale=Math.min(1,size/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',0.75);if(data.length>370000){size=256;const s=Math.min(1,size/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*s));canvas.height=Math.max(1,Math.round(img.height*s));ctx.drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',0.58)}if(data.length>395000){reject(new Error('حجم عکس هنوز زیاد است؛ عکس کوچک‌تری انتخاب کن.'));return}resolve(data)};img.src=String(reader.result)};
  reader.readAsDataURL(file)
 });
}
function handleChange(event){
 if(event.target.id==='avatar-file'){const file=event.target.files?.[0];if(!file)return;imageFileToDataUrl(file).then(data=>{v.pendingAvatar=data;const preview=$('avatar-edit-preview');if(preview)preview.innerHTML=av({...st.user,avatar:data},'lg');toast('عکس آمادهٔ ذخیره است')}).catch(e=>toast(e.message))}
}
async function logout(){['vexa_access_token','vexa_refresh_token','vexa_user'].forEach(store.del);st.user=null;st.token=null;v.friend=null;v.room=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value='';showMode('login')}
if(store.get('vexa_access_token')&&current()){st.user=current();st.token=store.get('vexa_access_token');st.refresh=store.get('vexa_refresh_token');renderApp()}else{$('auth').classList.remove('hidden')}
</script></body></html>
