async function load(silent=false){
 if(refreshInProgress)return;
 refreshInProgress=true;
 const before=JSON.stringify([v.friends,v.requests,v.outgoing,v.rooms,v.users,v.messages,v.networkError]);
 try{
  const requests=await Promise.allSettled([api('/friends/all-friends'),api('/friends/pending-requests'),api('/friends/outgoing-requests'),api('/rooms/open-rooms'),api('/users/directory'),...(v.view==='chat'&&v.room?[api('/messages/'+encodeURIComponent(userId(v.room))+'?limit=100&page=1')]:[])]);

  if(requests[1].status==='fulfilled')v.requests=arr(requests[1].value);
  if(requests[2].status==='fulfilled')v.outgoing=arr(requests[2].value);
  if(requests[3].status==='fulfilled')v.rooms=arr(requests[3].value);
  if(requests[4].status==='fulfilled')v.users=arr(requests[4].value);
  if(requests[5]?.status==='fulfilled')v.messages=arr(requests[5].value).slice().reverse();
  const after=JSON.stringify([v.friends,v.requests,v.outgoing,v.rooms,v.users,v.messages,v.networkError]);
  if(before!==after){
   const shell=$('app-shell');
   const messageInput=silent&&v.view==='chat'?$('message-input'):null;
   const draft=messageInput?messageInput.value:null;
   const wasFocused=messageInput&&document.activeElement===messageInput;
   const cursor=messageInput?messageInput.selectionStart:null;
   if(silent&&shell)shell.classList.add('auto-refreshing');
   render();
   if(draft!==null){const next=$('message-input');if(next){next.value=draft;if(wasFocused){next.focus();try{next.setSelectionRange(cursor,cursor)}catch{}}}}
   if(silent&&shell)setTimeout(()=>shell.classList.remove('auto-refreshing'),350);
  }
 }finally{refreshInProgress=false}
}

nnouncement-stack" id="global-announcements"></div><header class="main-header" id="main-header"></header><section class="workspace-content" id="workspace-content"></section></main><nav class="mobile-dock" aria-label="ناوبری موبایل"><button data-nav="you">'+ico('profile')+'<span>من</span></button><button data-nav="notifications">'+ico('inbox')+'<span>اعلان‌ها</span></button><button data-nav="servers">'+ico('servers')+'<span>سرورها</span></button><button data-nav="home">'+ico('home')+'<span>خانه</span></button></nav><div id="dialog-root" class="dialog-root"></div></div>';

function renderSidebar(){
 const search=$('dm-search');const q=(search?.value||'').toLowerCase().trim();const entries=roomsWithPartners();const unique=new Map();
 entries.forEach(x=>{if(!unique.has(userId(x.user)))unique.set(userId(x.user),x)});
 const list=Array.from(unique.values()).filter(x=>(x.user.username||'').toLowerCase().includes(q)||tag(x.user).toLowerCase().includes(q));
 const root=$('dm-list');if(!root)return;
 let html=list.map(x=>'<button class="dm-row '+(v.view==='chat'&&v.friend&&userId(v.friend)===userId(x.user)?'active':'')+'" data-user-chat="'+esc(userId(x.user))+'">'+av(x.user)+'<span class="dm-copy"><b>'+esc(x.user.username||'کاربر')+'</b><small>'+esc(tag(x.user))+'</small></span></button>').join('');
 const friendsWithoutRoom=v.friends.filter(f=>!unique.has(userId(f.user))&&((f.user.username||'').toLowerCase().includes(q)||tag(f.user).toLowerCase().includes(q)));
 if(friendsWithoutRoom.length){html+='<div class="sidebar-section-heading" style="padding-top:14px"><span>شروع گفتگو</span></div>'+friendsWithoutRoom.map(x=>'<button class="dm-row" data-user-chat="'+esc(userId(x.user))+'">'+av(x.user)+'<span class="dm-copy"><b>'+esc(x.user.username||'کاربر')+'</b><small>شروع پیام مستقیم</small></span></button>').join('')}
 if(!html)html='<div class="empty-state" style="padding:30px 8px"><div class="empty-icon">'+ico('message')+'</div><h3 style="font-size:13px">هنوز گفتگویی نیست</h3><p>از بخش دوستان یک گفتگو را شروع کن.</p><button class="btn primary" style="margin-top:12px" data-nav="friends">دیدن دوستان</button></div>';
 root.innerHTML=html;
}
function render(){
 const shell=$('app-shell');if(!shell)return;
 if(v.view!=='serverRoom'&&window.vexaServerMessageTimer){clearInterval(window.vexaServerMessageTimer);window.vexaServerMessageTimer=null;}
 shell.classList.toggle('chat-open',v.view==='chat');
 shell.classList.toggle('server-focus',v.view==='serverRoom');
 shell.classList.toggle('member-open',v.view==='chat'&&v.memberPanel);
 document.querySelectorAll('[data-nav]').forEach(b=>{const key=b.dataset.nav;const on=(key==='home'&&v.view==='home')||(key==='friends'&&v.view==='friends')||(key==='notifications'&&v.view==='friends'&&v.tab==='pending')||(key==='you'&&v.view==='profile')||(key==='dms'&&(v.view==='dms'||v.view==='chat'))||(key==='servers'&&(v.view==='servers'||v.view==='serverDiscover'));b.classList.toggle('active',on)});
 
 document.querySelectorAll('.mobile-dock [data-nav]').forEach(b=>b.classList.toggle('active',(b.dataset.nav==='home'&&v.view==='home')||(b.dataset.nav==='dms'&&(v.view==='dms'||v.view==='chat'))||(b.dataset.nav==='notifications'&&v.view==='friends'&&v.tab==='pending')||(b.dataset.nav==='you'&&v.view==='profile')));
 renderSidebar();renderMain();
}
function setView(name){v.view=name;if(name!=='chat'){v.friend=null;v.room=null;v.messages=[]}if(name==='friends')v.tab=v.tab||'all';render()}
function setNav(name){if(name==='home'){v.view='home';v.friend=null;v.room=null;v.messages=[];v.tab='all'}else if(name==='friends'){v.view='friends';v.friend=null;v.room=null;v.messages=[];v.tab='all'}else if(name==='notifications'){v.view='friends';v.friend=null;v.room=null;v.messages=[];v.tab='pending'}else if(name==='you'){v.view='profile';v.profileTab='profile';v.friend=null;v.room=null;v.messages=[]}else if(name==='dms'){v.view='dms';v.friend=null;v.room=null;v.messages=[]}else if(name==='servers'){v.view='servers';v.friend=null;v.room=null;v.messages=[]}render()}
function renderMain(){
 const head=$('main-header'),content=$('workspace-content');if(!head||!content)return;
 if(v.view==='chat'){renderChat();return}
 const headerMap={
 home:[ico('home'),'خانه',''],
 friends:[ico('friends'),'دوستان',''],
 notifications:[ico('inbox'),'اعلان‌ها',''],
 dms:[ico('message'),'پیام‌های مستقیم',''],
 profile:[ico('settings'),'تنظیمات کاربر',''],
 servers:[ico('servers'),'سرورها',''],
 serverRoom:[ico('servers'),v.currentServer?.name||'سرور',''],
 serverDiscover:[ico('discover'),'پیدا کردن سرور','']
 };
 if(v.view==='serverRoom'){renderServerRoom(content,v.currentServer);head.innerHTML='<div class="main-header-title">'+ico('servers')+'<b>'+esc(v.currentServer?.name||'سرور')+'</b></div>';return}
 const h=headerMap[v.view]||headerMap.friends;
 head.innerHTML='<div class="main-header-title">'+(v.view==='chat'?'<button class="icon-button mobile-back" data-action="back-mobile">'+ico('chevron')+'</button>':'')+h[0]+'<b>'+h[1]+'</b></div><div class="header-separator"></div><div class="header-actions">'+(v.view==='chat'?'<button class="icon-button" data-action="toggle-members" title="نمایش اعضا">'+ico('friends')+'</button><button class="icon-button" data-action="profile-friend" title="اطلاعات کاربر">'+ico('profile')+'</button>':'')+(v.view==='profile'?'<button class="icon-button profile-settings-gear" data-action="open-settings" title="تنظیمات">'+ico('settings')+'</button>':'')+'<button class="icon-button" data-action="theme" title="تغییر پوسته">'+(document.documentElement.dataset.theme==='dark'?ico('sun'):ico('moon'))+'</button></div>';
 if(v.view==='friends'||v.view==='home')renderFriendsPage(content);
 else if(v.view==='dms')renderDmsPage(content);
 else if(v.view==='profile')renderProfilePage(content);
 else if(v.view==='servers'||v.view==='serverDiscover')renderServersPage(content);
 else renderFriendsPage(content);
}
function renderFriendsPage(root){
 const tabs=[['online','آنلاین'],['all','همه'],['pending','در انتظار'],['outgoing','ارسال‌شده'],['add','افزودن دوست']];
 const tabBar=tabs.map(([key,label])=>'<button data-tab="'+key+'" class="'+(v.tab===key?'active ':'')+(key==='add'?'add-tab':'')+'">'+label+(key==='pending'&&v.requests.length?' · '+v.requests.length:'')+'</button>').join('');
 let left='';
 if(v.networkError)left+='<div class="inline-alert"><strong>اتصال برقرار نشد.</strong> '+esc(v.networkError)+' <button class="btn" data-action="refresh">تلاش دوباره</button></div>';
 if(v.tab==='add'){
  const q=(v.directoryQuery||'').toLowerCase().trim();const friendIds=new Set(v.friends.map(x=>userId(x.user)));const outgoingIds=new Set(v.outgoing.map(r=>userId(r.to)));const users=v.users.filter(u=>userId(u)!==userId(st.user)&&(!q||tag(u).toLowerCase().includes(q)||String(u.username||'').toLowerCase().includes(q)));
  left+='<div class="page-title">افزودن دوست</div><p class="page-subtitle">با کد کاربری یا از فهرست کاربران وکسا دوستت را پیدا کن.</p><form id="add-by-tag" class="field" style="max-width:680px"><label>کد کاربری</label><div style="display:flex;gap:8px;direction:rtl"><input id="friend-tag-input" required placeholder="username#1234" style="flex:1;min-width:0"><button class="btn primary">ارسال درخواست</button></div></form><div class="section-head"><h2>پیدا کردن کاربران</h2><small>'+users.length+' کاربر</small></div><input class="search" id="directory-search" value="'+esc(v.directoryQuery||'')+'" placeholder="جستجو با نام کاربری یا کد" style="margin:0 0 12px;background:var(--panel);width:100%;height:39px">';
  left+=users.slice(0,30).map(u=>'<div class="person-card">'+av(u)+'<div class="person-copy"><b>'+esc(u.username||'کاربر')+verifiedBadge(u)+'</b><small dir="ltr">'+esc(tag(u))+'</small><small>'+statusDot(u.presenceStatus)+' '+shortStatus(u.presenceStatus)+' · '+esc(u.bio||'هنوز بیوگرافی ننوشته.')+'</small></div><button class="icon-button" data-action="friend-more" data-user-id="'+esc(userId(u))+'" title="اطلاعات کاربر">'+ico('profile')+'</button>'+(friendIds.has(userId(u))?'<button class="btn" data-user-chat="'+esc(userId(u))+'">پیام</button>':outgoingIds.has(userId(u))?'<button class="btn" disabled>درخواست ارسال شده</button>':'<button class="btn primary" data-add-user="'+esc(userId(u))+'">افزودن</button>')+'</div>').join('');
  if(!users.length)left+='<div class="empty-state"><div class="empty-icon">'+ico('search')+'</div><h3>کاربری پیدا نشد</h3><p>نام کاربری یا کد را بررسی کن.</p></div>';
 }else if(v.tab==='pending'){
  left+='<div class="section-head"><h2>درخواست‌های دریافتی</h2><small>'+v.requests.length+' درخواست</small></div>';
  left+=v.requests.map(r=>'<div class="friend-row">'+av(r.from)+'<div class="friend-user"><b>'+esc(r.from?.username||'کاربر')+'</b><small dir="ltr">'+esc(tag(r.from))+'</small></div><div class="friend-actions"><button class="btn primary" data-accept="'+esc(userId(r))+'">'+ico('check')+' قبول</button><button class="icon-button" data-cancel-request="'+esc(userId(r))+'" title="رد درخواست">'+ico('close')+'</button></div></div>').join('');
  if(!v.requests.length)left+='<div class="empty-state"><div class="empty-icon">'+ico('check')+'</div><h3>درخواستی نداری</h3><p>وقتی کسی برایت درخواست دوستی بفرستد، اینجا نمایش داده می‌شود.</p></div>';
 }else if(v.tab==='outgoing'){
  left+='<div class="section-head"><h2>درخواست‌های ارسال‌شده</h2><small>'+v.outgoing.length+' درخواست</small></div>';

 }

function imageFileToDataUrl(file){
 return new Promise((resolve,reject)=>{
  if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){reject(new Error('لطفاً یک تصویر PNG، JPG یا WebP انتخاب کن.'));return}
  const reader=new FileReader();reader.onerror=()=>reject(new Error('خواندن عکس ناموفق بود.'));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('این تصویر باز نشد.'));img.onload=()=>{let size=384;const canvas=document.createElement('canvas');const scale=Math.min(1,size/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',0.75);if(data.length>370000){size=256;const s=Math.min(1,size/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*s));canvas.height=Math.max(1,Math.round(img.height*s));ctx.drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',0.58)}if(data.length>395000){reject(new Error('حجم عکس هنوز زیاد است؛ عکس کوچک‌تری انتخاب کن.'));return}resolve(data)};img.src=String(reader.result)};
  reader.readAsDataURL(file)
 });
}

 style.textContent='.vexa-channel-tools{max-width:650px}.vexa-channel-tools-form{display:grid;gap:13px}.vexa-channel-tools-form .field{display:grid;gap:7px;color:var(--text);font-size:13px;font-weight:700}.vexa-channel-tools-form input,.vexa-channel-tools-form select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:12px;font:inherit;outline:none}.vexa-channel-tools-form input:focus,.vexa-channel-tools-form select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--soft)}.vexa-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.vexa-toggle-row span{display:grid;gap:3px}.vexa-toggle-row small{font-size:11px;color:var(--muted)}.vexa-toggle-row input{width:20px;height:20px;accent-color:var(--green);flex:none}.vexa-channel-access{display:grid;gap:9px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.vexa-channel-access>small{color:var(--muted);font-size:11px;line-height:1.8}.vexa-channel-access>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vexa-role-access{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}.vexa-role-access input{accent-color:var(--green)}.vexa-role-access i{width:9px;height:9px;border-radius:50%;background:var(--role-color);flex:none}.vexa-role-access span{overflow-wrap:anywhere;font-size:12px}.server-channel-top [data-vexa-channel-tools],.server-channel-top [data-vexa-channel-search],.server-channel-top [data-vexa-channel-poll]{flex:none;transition:transform .18s ease,background .18s ease}.server-channel-top [data-vexa-channel-tools]:hover,.server-channel-top [data-vexa-channel-search]:hover,.server-channel-top [data-vexa-channel-poll]:hover{transform:translateY(-2px);background:var(--soft)}@media(max-width:520px){.vexa-channel-tools-form{gap:10px}.vexa-channel-tools .dialog-head h2{font-size:19px}}';
 document.head.appendChild(style);
 const dragStyle=document.createElement('style');dragStyle.textContent='.vexa-channel-category{margin:0 0 20px;animation:vexa-category-in .28s ease both}.vexa-channel-category>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;padding:0 4px;color:var(--green);font-weight:800}.vexa-channel-category>header span{display:flex;align-items:center;gap:8px}.vexa-channel-category>header small{font-size:11px;color:var(--muted);font-weight:600}.vexa-channel-category-list{display:flex;flex-direction:column;gap:9px}.server-channel-card[draggable=true]{cursor:grab}.server-channel-card.is-dragging{opacity:.45;transform:scale(.985)}.server-channel-card.drag-over{border-color:var(--green);box-shadow:0 0 0 2px var(--soft);transform:translateY(-2px)}.vexa-drag-handle{font-size:22px;color:var(--muted);padding:0 4px;cursor:grab}.server-channel-card{touch-action:pan-y}@keyframes vexa-category-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:520px){.vexa-channel-category{margin-bottom:16px}.server-channel-card{padding:13px;gap:10px}}';document.head.appendChild(dragStyle);let draggedChannelId=null;document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-channel-drag-id]');if(!card)return;draggedChannelId=card.dataset.channelDragId;card.classList.add('is-dragging');if(event.dataTransfer){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggedChannelId)}});document.addEventListener('dragend',event=>{const card=event.target.closest('[data-channel-drag-id]');if(card)card.classList.remove('is-dragging');document.querySelectorAll('.server-channel-card.drag-over').forEach(el=>el.classList.remove('drag-over'));draggedChannelId=null});document.addEventListener('dragover',event=>{const card=event.target.closest('[data-channel-drag-id]');if(!card||!draggedChannelId||card.dataset.channelDragId===draggedChannelId)return;event.preventDefault();document.querySelectorAll('.server-channel-card.drag-over').forEach(el=>el.classList.remove('drag-over'));card.classList.add('drag-over')});document.addEventListener('drop',async event=>{const target=event.target.closest('[data-channel-drag-id]');if(!target||!draggedChannelId||!v.currentServer?.isOwner)return;event.preventDefault();const from=String(draggedChannelId),to=String(target.dataset.channelDragId);if(from===to)return;const all=arr(v.currentServer.channels).slice(),fromIndex=all.findIndex(c=>String(c.id)===from),toIndex=all.findIndex(c=>String(c.id)===to);if(fromIndex<0||toIndex<0)return;const [moved]=all.splice(fromIndex,1);all.splice(toIndex,0,moved);try{await api('/servers/'+encodeURIComponent(v.currentServer.id)+'/channels/reorder',{method:'PATCH',body:JSON.stringify({channelIds:all.map(c=>c.id)})});v.currentServer.channels=all;render();toast('ترتیب کانال‌ها ذخیره شد.')}catch(e){toast(e.message||'مرتب‌سازی ذخیره نشد')}});
 document.addEventListener('click',async event=>{
  const settings=event.target.closest('[data-vexa-channel-tools]');
  if(settings){openChannelTools();return}
  const search=event.target.closest('[data-vexa-channel-search]');
  if(search){
   const query=prompt('عبارت موردنظر برای جست‌وجو در این کانال:');if(!query||!query.trim())return;
   try{const rows=await api(apiPath('/messages?q='+encodeURIComponent(query.trim())));openDialog('<div class="dialog-card"><div class="dialog-head"><h2>نتایج جست‌وجو</h2><button class="icon-button" data-action="close-dialog">×</button></div><p class="muted">'+rows.length+' نتیجه</p><div class="vexa-search-results">'+(rows.length?rows.map(m=>'<article class="post"><b>'+esc(m.author?.username||'کاربر')+'</b><p>'+esc(m.text||'')+'</p><small class="muted">'+esc(m.createdAt?new Date(m.createdAt).toLocaleString('fa-IR'):'')+'</small></article>').join(''):'<p class="muted">نتیجه‌ای پیدا نشد.</p>')+'</div></div>')}catch(e){toast(e.message||'جست‌وجو انجام نشد')}
  }
  const poll=event.target.closest('[data-vexa-channel-poll]');
  if(poll){
   const question=prompt('سؤال نظرسنجی چیه؟');if(!question?.trim())return;
   const raw=prompt('گزینه‌ها را با ویرگول جدا کن (حداقل دو گزینه):');if(!raw)return;
   try{await api(apiPath('/polls'),{method:'POST',body:JSON.stringify({question:question.trim(),options:raw.split(',').map(x=>x.trim()).filter(Boolean)})});toast('نظرسنجی ساخته شد.');}catch(e){toast(e.message||'ساخت نظرسنجی ناموفق بود')}
  }
 });
 document.addEventListener('submit',async event=>{
  const form=event.target;if(form.id!=='vexa-channel-settings-form')return;
  event.preventDefault();const data=new FormData(form);
  const body={name:String(data.get('name')||''),topic:String(data.get('topic')||''),category:String(data.get('category')||'عمومی'),type:String(data.get('type')||'text'),slowModeSeconds:Number(data.get('slowModeSeconds')||0),readOnly:data.has('readOnly'),private:data.has('private'),archived:data.has('archived'),allowedRoleIds:data.getAll('allowedRoleIds').map(String)};
  try{await api(apiPath(''),{method:'PATCH',body:JSON.stringify(body)});toast('تنظیمات کانال ذخیره شد.');closeDialog();const updated=await api('/servers/'+encodeURIComponent(v.currentServer.id));v.currentServer=updated;if(body.archived){v.currentChannelId=arr(updated.channels).find(c=>!c.archived)?.id||null;v.serverChannelOpen=false}render()}catch(e){toast(e.message||'ذخیره تنظیمات ناموفق بود')}
 });

 addHeaderTools();
