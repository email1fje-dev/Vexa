<!doctype html><html lang="fa" dir="rtl" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وکسا</title><style>
:root{--bg:#0a100c;--panel:#111a14;--panel2:#17231a;--line:#26392b;--text:#edf7ef;--muted:#9bb09f;--green:#22c55e;--soft:#163622}html[data-theme=light]{--bg:#f2faf3;--panel:#fff;--panel2:#f5fbf6;--line:#d5e5d8;--text:#183021;--muted:#66796b;--green:#16843b;--soft:#e6f7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Tahoma,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.hidden{display:none!important}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:750}.primary{background:linear-gradient(135deg,#22c55e,#15803d);color:white;border:0}.field{display:grid;gap:7px;margin:13px 0}.field input,.search,.composer textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:12px;outline:none}.field input:focus,.search:focus{border-color:var(--green)}.auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top right,#164a2a55,transparent 48%)}.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 22px 70px #0003}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:950}.logo{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#14532d);border-radius:13px;color:#fff}.auth h1{margin:26px 0 5px}.auth p{color:var(--muted);line-height:1.8}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.status{color:#fda4af;line-height:1.8}.shell{display:grid;grid-template-columns:285px minmax(0,1fr);height:100dvh;overflow:hidden}.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--line)}.sidehead .logo{width:36px;height:36px}.sidehead b{font-size:18px}.nav{padding:14px 10px 8px;display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:11px;text-align:right;width:100%;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);padding:12px;font-weight:800}.nav button.active,.nav button:hover{background:var(--soft);border-color:#22c55e30;color:var(--text)}.nav .ico{width:24px;text-align:center;font-size:18px}.search{margin:8px 12px;width:calc(100% - 24px);font-size:12px}.label{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;color:var(--muted);font-size:11px;font-weight:900}.label button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;width:29px;height:29px}.dms{overflow:auto;flex:1;padding:0 9px}.dm{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1px solid transparent;border-radius:11px;padding:9px;background:transparent;color:var(--text);margin-bottom:3px}.dm:hover,.dm.active{background:var(--soft);border-color:#22c55e30}.avatar{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:13px;background:linear-gradient(135deg,#22c55e,#14532d);color:#fff;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.dm strong{display:block;font-size:12px}.dm small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.me{display:flex;align-items:center;gap:9px;padding:12px;background:var(--panel2);border-top:1px solid var(--line)}.me .who{flex:1;min-width:0}.me b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.me small{color:var(--muted);font-size:10px}.main{min-width:0;display:flex;flex-direction:column}.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 25px;background:var(--panel);border-bottom:1px solid var(--line)}.top h2{font-size:15px}.top-actions{display:flex;gap:8px}.content{overflow:auto;flex:1}.pane{max-width:1050px;margin:auto;padding:32px}.pane h1{font-size:30px;margin:0 0 8px}.pane>p{color:var(--muted);line-height:1.8}.tabsline{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:22px 0 16px}.tabsline button{padding:12px 2px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:800}.tabsline button.active{border-color:var(--green);color:var(--text)}.person{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}.person .who{flex:1;min-width:0}.person b{display:block}.person small{color:var(--muted)}.empty{margin:20px auto;text-align:center;border:1px dashed var(--line);background:var(--panel);border-radius:18px;padding:35px 20px;max-width:460px}.empty .symbol{font-size:32px}.empty p{color:var(--muted);line-height:1.8}.chat{height:100%;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:22px 28px;display:flex;flex-direction:column;gap:16px}.msg{display:flex;gap:10px;align-items:flex-start}.msgbody{min-width:0}.msghead{display:flex;gap:10px;align-items:center}.msghead small{color:var(--muted)}.msgtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin-top:5px}.composer{padding:0 24px 20px}.composer form{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);padding:9px;border-radius:14px}.composer textarea{border:0;resize:none;max-height:140px;min-height:38px;background:transparent}.toast{position:fixed;bottom:20px;left:20px;background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:50;max-width:calc(100% - 40px)}.mobile{display:none}
@media(max-width:700px){.shell{display:block;height:100dvh;padding-bottom:62px}.side{height:calc(100dvh - 62px)}.main{display:none;height:calc(100dvh - 62px)}.shell.chat-open .side{display:none}.shell.chat-open .main{display:flex}.pane{padding:22px 15px}.top{height:58px;padding:0 14px}.messages{padding:18px 12px}.composer{padding:0 10px 10px}.mobile{display:grid;position:fixed;bottom:0;right:0;left:0;height:62px;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding:4px 10px max(4px,env(safe-area-inset-bottom));z-index:30}.mobile button{border:0;background:transparent;color:var(--muted);border-radius:10px;font-size:11px}.mobile button.active{background:var(--soft);color:var(--green)}}
</style><body><section id="auth" class="auth"><div class="auth-card"><div class="brand"><span class="logo">V</span> وکسا</div><h1 id="auth-title">خوش برگشتی 💚</h1><p>دوستات، گفتگوها و کامیونیتی‌هات؛ همه توی یک جا.</p><div class="tabs"><button class="btn primary" id="login-tab">ورود</button><button class="btn" id="signup-tab">ساخت حساب</button></div><form id="auth-form"><div class="field hidden" id="username-wrap"><label>نام کاربری</label><input id="username" minlength="4" autocomplete="username"></div><div class="field"><label>ایمیل</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><p id="auth-error" class="status"></p><button class="btn primary" style="width:100%" id="auth-submit">ورود به وکسا</button></form></div></section><section id="app" class="hidden"></section><div id="toast"></div><script>
const $=id=>document.getElementById(id),store={get:(k,d='')=>{try{return localStorage.getItem(k)??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const st={mode:'login',user:null,token:null,refresh:null},v={friends:[],requests:[],users:[],rooms:[],view:'friends',tab:'all',friend:null,room:null,messages:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=u=>u?.id||u?._id,tag=u=>(u?.username||'کاربر')+(u?.shortId?'#'+u.shortId:'');
const base=()=>location.origin+'/api/v1';const theme=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('vexa_theme',t)};
document.documentElement.dataset.theme=store.get('vexa_theme','dark');
function toast(s){$('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toast').innerHTML='',2800)}
async function api(path,opts={}){const token=st.token||store.get('vexa_access_token');const r=await fetch(base()+path,{...opts,cache:'no-store',headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||'درخواست ناموفق بود');return d}
function avatar(u){return '<span class="avatar">'+(u?.avatar?'<img src="'+esc(u.avatar)+'">':esc((u?.username||'V').slice(0,1).toUpperCase()))+'</span>'}
function current(){try{return JSON.parse(store.get('vexa_user','null'))}catch{return null}}
function showMode(mode){st.mode=mode;$('username-wrap').classList.toggle('hidden',mode!=='signup');$('login-tab').classList.toggle('primary',mode==='login');$('signup-tab').classList.toggle('primary',mode==='signup');$('auth-title').textContent=mode==='login'?'خوش برگشتی 💚':'حساب وکسا بساز';$('auth-submit').textContent=mode==='login'?'ورود به وکسا':'ساخت حساب و ورود';$('auth-error').textContent=''}
$('login-tab').onclick=()=>showMode('login');$('signup-tab').onclick=()=>showMode('signup');
$('auth-form').onsubmit=async e=>{e.preventDefault();$('auth-error').textContent='';const payload=st.mode==='signup'?{username:$('username').value.trim(),email:$('email').value.trim().toLowerCase(),password:$('password').value}:{email:$('email').value.trim().toLowerCase(),password:$('password').value};const b=$('auth-submit');b.disabled=true;try{const r=await fetch(base()+'/auth/'+(st.mode==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.message||'ورود انجام نشد');if(!d.tokens?.access?.token||!d.user)throw Error('پاسخ سرور معتبر نیست');st.user=d.user;st.token=d.tokens.access.token;st.refresh=d.tokens.refresh?.token||'';store.set('vexa_access_token',st.token);store.set('vexa_refresh_token',st.refresh);store.set('vexa_user',JSON.stringify(st.user));renderApp()}catch(err){$('auth-error').textContent=err.message}finally{b.disabled=false}};
async function load(){const out=await Promise.allSettled([api('/friends/all-friends'),api('/friends/pending-requests'),api('/rooms/open-rooms'),api('/users/directory')]);if(out[0].status==='fulfilled')v.friends=out[0].value.map(r=>({request:r,user:String(id(r.from))===String(id(st.user))?r.to:r.from})).filter(x=>x.user&&id(x.user));if(out[1].status==='fulfilled')v.requests=out[1].value;if(out[2].status==='fulfilled')v.rooms=out[2].value;if(out[3].status==='fulfilled')v.users=out[3].value;render()}
function renderApp(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('app').innerHTML='<div class="shell"><aside class="side"><div class="sidehead"><span class="logo">V</span><b>وکسا</b></div><nav class="nav"><button id="friends-nav" class="active"><span class="ico">♧</span>دوستان</button><button id="servers-nav"><span class="ico">▤</span>سرورها <small class="muted">به‌زودی</small></button></nav><input class="search" id="search" placeholder="جست‌وجوی گفتگوها"><div class="label">پیام‌های مستقیم <button id="add-short">+</button></div><div class="dms" id="dms"></div><div class="me">'+avatar(st.user)+'<div class="who"><b>'+esc(st.user.username)+'</b><small>حساب شخصی</small></div><button class="btn" id="profile-btn">◉</button><button class="btn" id="logout">↪</button></div></aside><main class="main"><header class="top"><h2 id="heading">دوستان</h2><div class="top-actions"><button class="btn" id="theme-btn">◐</button><button class="btn" id="profile-top">پروفایل</button></div></header><div class="content" id="content"></div></main><nav class="mobile"><button data-m="friends" class="active">♧<br>دوستان</button><button data-m="servers">▤<br>سرورها</button><button data-m="profile">◉<br>پروفایل</button></nav></div>';const openProfile=()=>{v.view='profile';v.friend=null;v.room=null;render()};$('friends-nav').onclick=()=>{v.view='friends';v.tab='all';v.friend=null;v.room=null;render()};$('servers-nav').onclick=()=>{v.view='servers';v.friend=null;v.room=null;render()};$('add-short').onclick=()=>{v.view='friends';v.tab='add';v.friend=null;v.room=null;render()};$('profile-btn').onclick=openProfile;$('profile-top').onclick=openProfile;$('theme-btn').onclick=()=>{theme();render()};$('logout').onclick=logout;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(b.dataset.m==='profile')return openProfile();v.view=b.dataset.m;v.friend=null;v.room=null;render()});$('search').oninput=renderDms;load()}
function renderDms(){const root=$('dms');if(!root)return;const q=($('search')?.value||'').toLowerCase();root.innerHTML=v.friends.filter(x=>tag(x.user).toLowerCase().includes(q)).map(x=>'<button class="dm '+(v.friend&&String(id(v.friend))===String(id(x.user))?'active':'')+'" data-dm="'+esc(id(x.user))+'">'+avatar(x.user)+'<span><strong>'+esc(x.user.username)+'</strong><small>'+esc(tag(x.user))+'</small></span></button>').join('');root.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>openDm(v.friends.find(x=>String(id(x.user))===b.dataset.dm).user))}
function render(){renderDms();document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('active',b.dataset.m===(v.view==='chat'?'friends':v.view)));$('friends-nav')?.classList.toggle('active',v.view==='friends'||v.view==='chat');$('servers-nav')?.classList.toggle('active',v.view==='servers');const c=$('content');if(!c)return;document.querySelector('.shell')?.classList.toggle('chat-open',v.view==='chat');if(v.view==='chat'&&v.friend&&v.room)return renderChat();if(v.view==='servers'){$('heading').textContent='سرورها';c.innerHTML='<div class="pane"><h1>سرورها</h1><p>فضاهای گروهی و کانال‌ها اینجا قرار می‌گیرن.</p><div class="empty"><div class="symbol">▤</div><h3>سرورها به‌زودی</h3><p>سرورها مستقل از دوستان و پیام‌های خصوصی طراحی می‌شن.</p></div></div>';return}if(v.view==='profile'){$('heading').textContent='پروفایل';c.innerHTML='<div class="pane"><h1>پروفایل من</h1><p>کد کاربریت رو برای اضافه‌کردن دوست بفرست.</p><div class="person">'+avatar(st.user)+'<div class="who"><b>'+esc(st.user.username)+'</b><small dir="ltr">'+esc(tag(st.user))+'</small></div></div><button class="btn" id="copy-tag">کپی کد کاربری</button><button class="btn" id="back">بازگشت</button></div>';$('copy-tag').onclick=()=>navigator.clipboard?.writeText(tag(st.user)).then(()=>toast('کپی شد'));$('back').onclick=()=>{v.view='friends';render()};return}
$('heading').textContent='دوستان';const tabs='<div class="tabsline"><button data-tab="all" class="'+(v.tab==='all'?'active':'')+'">همهٔ دوستان · '+v.friends.length+'</button><button data-tab="pending" class="'+(v.tab==='pending'?'active':'')+'">درخواست‌ها '+(v.requests.length?'('+v.requests.length+')':'')+'</button><button data-tab="add" class="'+(v.tab==='add'?'active':'')+'">افزودن دوست</button></div>';
let body='';if(v.tab==='pending')body=v.requests.length?v.requests.map(r=>'<div class="person">'+avatar(r.from)+'<div class="who"><b>'+esc(tag(r.from))+'</b><small>درخواست دوستی</small></div><button class="btn primary" data-accept="'+esc(id(r))+'">قبول</button></div>').join(''):'<div class="empty"><div class="symbol">✓</div><h3>درخواستی نداری</h3><p>درخواست‌های جدید اینجا نمایش داده می‌شن.</p></div>';
else if(v.tab==='add')body='<form id="add-form" class="field"><label>کد کاربری دوستت</label><input id="friend-tag" placeholder="username#1234" required><button class="btn primary">ارسال درخواست دوستی</button></form>';
else body=(v.friends.length?v.friends.map(x=>'<div class="person">'+avatar(x.user)+'<div class="who"><b>'+esc(x.user.username)+'</b><small dir="ltr">'+esc(tag(x.user))+'</small></div><button class="btn primary" data-chat="'+esc(id(x.user))+'">پیام دادن</button></div>').join(''):'<div class="empty"><div class="symbol">♧</div><h3>دوست‌هات اینجا دیده می‌شن</h3><p>از «افزودن دوست» استفاده کن تا گفتگو رو شروع کنی.</p></div>')+'<h3 style="margin-top:30px">پیدا کردن کاربران</h3><p class="muted">کاربران وکسا، جدا از فهرست سرورها.</p>'+(v.users.filter(u=>String(id(u))!==String(id(st.user))).map(u=>'<div class="person">'+avatar(u)+'<div class="who"><b>'+esc(u.username)+'</b><small dir="ltr">'+esc(tag(u))+'</small></div><button class="btn" data-add="'+esc(id(u))+'">'+(v.friends.some(x=>String(id(x.user))===String(id(u)))?'پیام دادن':'افزودن دوست')+'</button></div>').join('')||'<p class="muted">فعلاً کاربر دیگری پیدا نشد.</p>');
c.innerHTML='<div class="pane"><h1>دوستان</h1><p>دوست‌هات، درخواست‌ها و گفتگوهای مستقیم؛ همه در یک بخش مستقل از سرورها.</p>'+tabs+body+'</div>';c.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{v.tab=b.dataset.tab;render()});c.querySelectorAll('[data-chat]').forEach(b=>openDm(v.friends.find(x=>String(id(x.user))===b.dataset.chat).user));c.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{try{await api('/friends/accept-pending-request',{method:'PATCH',body:JSON.stringify({id:b.dataset.accept})});await load();toast('درخواست پذیرفته شد')}catch(e){toast(e.message)}});c.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const u=v.users.find(x=>String(id(x))===b.dataset.add);if(v.friends.some(x=>String(id(x.user))===String(id(u))))return openDm(u);try{await api('/friends/add-friend-request',{method:'POST',body:JSON.stringify({username:u.username,shortId:u.shortId})});toast('درخواست ارسال شد');await load()}catch(e){toast(e.message)}});const form=$('add-form');if(form)form.onsubmit=async e=>{e.preventDefault();const m=$('friend-tag').value.trim().match(/^(.+)#(\d{4})$/);if(!m)return toast('فرمت: username#1234');try{await api('/friends/add-friend-request',{method:'POST',body:JSON.stringify({username:m[1],shortId:m[2]})});toast('درخواست ارسال شد');v.tab='all';await load()}catch(err){toast(err.message)}}}
async function openDm(u){v.friend=u;v.view='chat';v.room=null;renderDms();render();try{v.room=await api('/rooms/get-or-create',{method:'POST',body:JSON.stringify({id:id(u)})});const d=await api('/messages/'+encodeURIComponent(id(v.room))+'?limit=100&page=1');v.messages=(Array.isArray(d)?d:d.results||[]).slice().reverse();render()}catch(e){toast('گفتگو باز نشد: '+e.message)}}
function renderChat(){const c=$('content');$('heading').textContent=tag(v.friend);c.innerHTML='<div class="chat"><div class="messages" id="messages">'+(!v.messages.length?'<div class="empty"><h3>'+esc(v.friend.username)+'</h3><p>این ابتدای گفتگوی شماست؛ یه سلام بفرست 💚</p></div>':'')+v.messages.map(m=>'<div class="msg">'+avatar(String(m.senderId?.id||m.senderId?._id||m.senderId)===String(id(st.user))?st.user:v.friend)+'<div class="msgbody"><div class="msghead"><b>'+esc(String(m.senderId?.id||m.senderId?._id||m.senderId)===String(id(st.user))?'من':v.friend.username)+'</b><small>'+esc(m.createdAt?new Date(m.createdAt).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}):'')+'</small></div><div class="msgtext">'+esc(m.message||m.text||'')+'</div></div></div>').join('')+'</div><div class="composer"><form id="send"><textarea id="message" rows="1" placeholder="پیام به '+esc(v.friend.username)+'"></textarea><button class="btn primary">ارسال</button></form></div></div>';const ms=$('messages');ms.scrollTop=ms.scrollHeight;$('send').onsubmit=async e=>{e.preventDefault();const input=$('message'),text=input.value.trim();if(!text)return;try{await api('/messages/send-message',{method:'POST',body:JSON.stringify({roomId:id(v.room),text})});input.value='';const d=await api('/messages/'+encodeURIComponent(id(v.room))+'?limit=100&page=1');v.messages=(Array.isArray(d)?d:d.results||[]).slice().reverse();renderChat()}catch(err){toast(err.message)}}}
async function logout(){['vexa_access_token','vexa_refresh_token','vexa_user'].forEach(store.del);st.user=null;st.token=null;v.friend=null;v.room=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
if(store.get('vexa_access_token')&&current()){st.user=current();st.token=store.get('vexa_access_token');st.refresh=store.get('vexa_refresh_token');renderApp()}else{$('auth').classList.remove('hidden')}
</script></body></html>
