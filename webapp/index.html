<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d09">
<meta name="description" content="وب‌اپ وکسا؛ فضای کامیونیتی‌ها و گفتگوهای تو">

<style>
/* Vexa theme: match the green/black landing page */
:root{color-scheme:dark;--vexa-bg:#080d09;--vexa-panel:#101812;--vexa-panel2:#141e16;--vexa-line:#26372b;--vexa-text:#f1f8f2;--vexa-muted:#a5b3a8;--vexa-green:#22c55e;--vexa-green2:#15803d}
*{box-sizing:border-box}
html,body,#root{min-height:100%;width:100%;margin:0}
html,body{background:var(--vexa-bg)!important;color:var(--vexa-text)!important;font-family:Tahoma,"Segoe UI",system-ui,sans-serif!important;direction:rtl}
body{overflow-x:hidden}
button,input,textarea,[role=button]{font:inherit}
::selection{background:#166534;color:#fff}
a{color:#86efac}
button,[role=button]{transition:background-color .15s,border-color .15s}
button:hover,[role=button]:hover{border-color:#39814e}
input,textarea,[contenteditable=true]{background:#0c130e!important;color:#f1f8f2!important;border-color:#2a3c2e!important;border-radius:8px}
input::placeholder,textarea::placeholder{color:#84978a!important}
button[class*="primary"],[class*="lookFilled"][class*="colorBrand"],[class*="button"][class*="brand"]{background:#16803d!important;color:white!important}
[class*="brand"],[class*="colorBrand"]{color:#86efac}
[class*="selected"],[aria-selected="true"]{background:#173b24!important}
[class*="sidebar"],[class*="Sidebar"],[class*="guilds"],[class*="Guilds"]{background:#090e0a!important}
[class*="chat"],[class*="Chat"],[class*="content"],[class*="Content"],[class*="members"],[class*="Members"]{color:var(--vexa-text)}
[class*="container"],[class*="panel"],[class*="Panel"],[class*="popout"],[class*="Popout"],[class*="modal"],[class*="Modal"]{border-color:var(--vexa-line)}
[class*="search"],[class*="Search"]{border-radius:9px}
img{max-width:100%}
@media(max-width:700px){html,body,#root{min-height:100dvh}button{min-height:36px}input,textarea{font-size:16px!important}}
/* Optional light theme is available through the theme toggle added below. */
html[data-theme="light"]{color-scheme:light;--vexa-bg:#f3faf4;--vexa-panel:#fff;--vexa-panel2:#edf7ef;--vexa-line:#d4e4d6;--vexa-text:#14251a;--vexa-muted:#617466}
html[data-theme="light"],html[data-theme="light"] body,html[data-theme="light"] #root{background:#f3faf4!important;color:#14251a!important}
html[data-theme="light"] input,html[data-theme="light"] textarea,html[data-theme="light"] [contenteditable=true]{background:#fff!important;color:#14251a!important;border-color:#d4e4d6!important}
html[data-theme="light"] [class*="sidebar"],html[data-theme="light"] [class*="Sidebar"],html[data-theme="light"] [class*="guilds"],html[data-theme="light"] [class*="Guilds"]{background:#eaf5ec!important}
html[data-theme="light"] [class*="chat"],html[data-theme="light"] [class*="Chat"],html[data-theme="light"] [class*="content"],html[data-theme="light"] [class*="Content"]{color:#14251a}
#vexa-theme-toggle{position:fixed;z-index:2147483000;top:12px;left:12px;border:1px solid #315c3c;border-radius:10px;background:#101812;color:#bbf7d0;padding:8px 11px;box-shadow:0 4px 18px #0002;cursor:pointer;font-size:13px}
html[dir="rtl"] #vexa-theme-toggle{left:12px;right:auto}
html[data-theme="light"] #vexa-theme-toggle{background:#fff;color:#166534;border-color:#c5e8ce}
</style>
</head>
<body>
<div id="root"></div>
<script src="./js/runtime.2cf7acf6d00a6f8e9d2a.bundle.js"></script>
<script src="./js/main.3a239e7ad8d28fca7bf9.bundle.js"></script>
<script>
(function(){
  const dictionary = {
    "Discord":"وکسا","Discord | Your Place to Talk and Hang Out":"وکسا | وب‌اپلیکیشن",
    "Friends":"دوستان","Friend":"دوست","Add Friend":"افزودن دوست","Message":"پیام","Messages":"پیام‌ها",
    "Direct Messages":"پیام‌های خصوصی","Find or start a conversation":"پیدا کردن یا شروع گفتگو",
    "Nitro":"نیترو","Shop":"فروشگاه","Discover":"کشف کامیونیتی‌ها","Library":"کتابخانه",
    "Home":"خانه","Activity":"فعالیت","Active Now":"اکنون فعال","Online":"آنلاین","Offline":"آفلاین",
    "All":"همه","Pending":"در انتظار","Blocked":"مسدودشده","Add":"افزودن","Cancel":"لغو","Save":"ذخیره",
    "Done":"انجام شد","Close":"بستن","Back":"بازگشت","Next":"بعدی","Continue":"ادامه","Submit":"ثبت",
    "Search":"جستجو","Search...":"جستجو...","Search for":"جستجو برای","Settings":"تنظیمات",
    "User Settings":"تنظیمات کاربر","My Account":"حساب من","Profiles":"نمایه‌ها","Profile":"نمایه",
    "Privacy & Safety":"حریم خصوصی و امنیت","Authorized Apps":"برنامه‌های مجاز","Connections":"اتصالات",
    "Appearance":"ظاهر","Accessibility":"دسترس‌پذیری","Voice & Video":"صدا و تصویر",
    "Notifications":"اعلان‌ها","Keybinds":"میانبرهای صفحه‌کلید","Language":"زبان",
    "Log Out":"خروج از حساب","Log In":"ورود","Login":"ورود","Register":"ثبت‌نام","Sign Up":"ثبت‌نام",
    "Email":"ایمیل","Email or Phone Number":"ایمیل یا شماره تلفن","Password":"گذرواژه",
    "Forgot your password?":"گذرواژه‌ات را فراموش کردی؟","Username":"نام کاربری","Display Name":"نام نمایشی",
    "What's your username?":"نام کاربری‌ات چیست؟","Create an account":"ساخت حساب کاربری",
    "Welcome back!":"خوش برگشتی!","Welcome to Discord":"به وکسا خوش آمدی",
    "Create a server":"ساخت کامیونیتی","Create My Own":"ساخت کامیونیتی خودم","Join a Server":"پیوستن به کامیونیتی",
    "Join a server":"پیوستن به کامیونیتی","Explore Discoverable Servers":"گشت‌وگذار در کامیونیتی‌ها",
    "Create Server":"ساخت کامیونیتی","Invite People":"دعوت از افراد","Invite your friends":"دوستانت را دعوت کن",
    "Server Settings":"تنظیمات کامیونیتی","Server":"کامیونیتی","Servers":"کامیونیتی‌ها",
    "Channels":"کانال‌ها","Channel":"کانال","Text Channels":"کانال‌های متنی","Voice Channels":"کانال‌های صوتی",
    "Create Channel":"ساخت کانال","Edit Channel":"ویرایش کانال","Delete Channel":"حذف کانال",
    "Browse Channels":"مرور کانال‌ها","Announcements":"اطلاعیه‌ها","General":"عمومی",
    "Send a message":"ارسال پیام","Message #":"پیام به کانال","Message @":"پیام به",
    "Message...":"پیامت را بنویس...","Message history":"تاریخچه پیام‌ها","No messages yet":"هنوز پیامی نیست",
    "Reply":"پاسخ","Reply to":"پاسخ به","Edit":"ویرایش","Delete":"حذف","Copy":"کپی","Copy Link":"کپی پیوند",
    "Pin Message":"سنجاق کردن پیام","Unpin Message":"برداشتن سنجاق پیام","Mark as Read":"علامت‌گذاری به‌عنوان خوانده‌شده",
    "Mute":"بی‌صدا کردن","Unmute":"فعال‌کردن صدا","Deafen":"قطع صدای ورودی","Undeafen":"وصل‌کردن صدای ورودی",
    "Invite":"دعوت","Members":"اعضا","Member":"عضو","Roles":"نقش‌ها","Role":"نقش",
    "Manage Members":"مدیریت اعضا","User Profile":"نمایه کاربر","Change Avatar":"تغییر تصویر نمایه",
    "Upload Image":"بارگذاری تصویر","Remove":"حذف","Today":"امروز","Yesterday":"دیروز",
    "Today at":"امروز ساعت","Yesterday at":"دیروز ساعت","Just now":"همین الان",
    "You do not have permission to do that.":"اجازه انجام این کار را نداری.",
    "Something went wrong.":"مشکلی پیش آمد.","Try again":"تلاش دوباره","Loading...":"در حال بارگذاری...",
    "Loading":"در حال بارگذاری","No results found":"نتیجه‌ای پیدا نشد","No results":"نتیجه‌ای وجود ندارد",
    "Help":"راهنما","What's New":"تازه‌ها","Support":"پشتیبانی","Terms":"شرایط استفاده",
    "Privacy":"حریم خصوصی","I agree":"موافقم","Accept":"پذیرفتن","Decline":"رد کردن",
    "Dark":"تیره","Light":"روشن","Automatic":"خودکار","Theme":"پوسته",
    "Open in Vexa":"باز کردن در وکسا","Vexa":"وکسا"
  };
  const exact = new Map(Object.entries(dictionary));
  const patterns = [
    [/^You are viewing an older version of this channel\.$/,"در حال مشاهده نسخه قدیمی‌تری از این کانال هستی."],
    [/^Welcome to (.+)!$/,"به $1 خوش آمدی!"],
    [/^Send a message in (.+)$/,"در $1 پیام بفرست"],
    [/^Search (.+)$/,"جستجو در $1"],
    [/^(d+) Members?$/,"$1 عضو"],
    [/^(d+) Online$/,"$1 نفر آنلاین"]
  ];
  function translateText(node){
    if(!node || node.nodeType!==Node.TEXT_NODE) return;
    const raw=node.nodeValue, trimmed=raw.trim();
    if(!trimmed || trimmed.length>180) return;
    if(exact.has(trimmed)){node.nodeValue=raw.replace(trimmed,exact.get(trimmed));return;}
    for(const [re,to] of patterns){if(re.test(trimmed)){node.nodeValue=raw.replace(trimmed,trimmed.replace(re,to));return;}}
  }
  function translateAttributes(el){
    if(!el || el.nodeType!==Node.ELEMENT_NODE) return;
    for(const attr of ["placeholder","aria-label","title","alt"]){
      const value=el.getAttribute(attr);if(value && exact.has(value))el.setAttribute(attr,exact.get(value));
    }
    if(el.tagName==="INPUT" && el.type==="submit" && exact.has(el.value))el.value=exact.get(el.value);
  }
  function walk(root){
    if(root.nodeType===Node.TEXT_NODE){translateText(root);return;}
    if(root.nodeType!==Node.ELEMENT_NODE && root.nodeType!==Node.DOCUMENT_NODE) return;
    if(root.nodeType===Node.ELEMENT_NODE){translateAttributes(root);if(root.closest && root.closest("#vexa-theme-toggle"))return;}
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n;while((n=walker.nextNode()))translateText(n);
    if(root.querySelectorAll)root.querySelectorAll("*").forEach(translateAttributes);
  }
  function addToggle(){
    if(document.getElementById("vexa-theme-toggle"))return;
    const b=document.createElement("button");b.id="vexa-theme-toggle";b.type="button";b.textContent=document.documentElement.dataset.theme==="light"?"🌙 پوسته تیره":"☀️ پوسته روشن";
    b.setAttribute("aria-label","تغییر پوسته");b.addEventListener("click",function(){const light=document.documentElement.dataset.theme!=="light";document.documentElement.dataset.theme=light?"light":"dark";document.querySelector('meta[name="theme-color"]').content=light?"#f3faf4":"#080d09";b.textContent=light?"🌙 پوسته تیره":"☀️ پوسته روشن";});
    document.body.appendChild(b);
  }
  function boot(){document.documentElement.lang="fa";document.documentElement.dir="rtl";walk(document.body);addToggle();}
  const observer=new MutationObserver(records=>{for(const record of records){if(record.type==="characterData")translateText(record.target);for(const node of record.addedNodes||[])walk(node);if(record.type==="attributes")translateAttributes(record.target);}addToggle();});
  observer.observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["placeholder","aria-label","title","alt"]});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
  window.addEventListener("load",boot);
})();
</script>
</body>
</html>
