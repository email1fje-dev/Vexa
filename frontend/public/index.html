<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b08" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Vexa؛ فضای گفت‌وگوی تو برای ارتباط با دوستات." />
    <meta name="application-name" content="Vexa" />
    <title>Vexa | فضای گفت‌وگوی تو</title>
    <script>
      (function () {
        try {
          var selected = localStorage.getItem('vexa-theme');
          if (selected === 'light' || selected === 'dark') document.documentElement.setAttribute('data-theme', selected);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <noscript><div style="margin:10vh auto;max-width:560px;padding:24px;text-align:center;font:16px Tahoma,sans-serif;line-height:2">برای اجرای Vexa، جاوااسکریپت مرورگر باید فعال باشد.</div></noscript>
    <div id="root"></div>
    <script>
      (function () {
        var failure = '';
        window.addEventListener('error', function (event) {
          if (event && event.target && (event.target.src || event.target.href)) failure = 'بارگذاری یکی از فایل‌های برنامه ناموفق بود.';
          else if (event && event.message) failure = String(event.message).slice(0, 160);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          failure = String(event && event.reason && event.reason.message || 'خطای اجرای برنامه').slice(0, 160);
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && (root.children.length || (root.textContent || '').trim())) return;
          if (document.getElementById('vexa-load-recovery')) return;
          var screen = document.createElement('main');
          screen.id = 'vexa-load-recovery';
          screen.dir = 'rtl';
          screen.style.cssText = 'position:fixed;inset:0;z-index:999999;display:grid;place-items:center;box-sizing:border-box;padding:20px;background:#070b08;color:#f0f7f1;font:14px Tahoma,Arial,sans-serif';
          screen.innerHTML = '<section style="width:min(100%,440px);padding:32px 25px;border:1px solid #294432;border-radius:24px;background:#101912;box-shadow:0 24px 80px #0008;text-align:center"><div style="font-size:36px;font-weight:900;color:#4ade80;letter-spacing:-1px">Vexa</div><div style="width:48px;height:4px;margin:15px auto 20px;background:#22c55e;border-radius:8px"></div><h1 style="font-size:22px;margin:0 0 12px">صفحه درست بارگذاری نشد</h1><p style="color:#9cab9e;line-height:2;margin:0 0 18px">وب‌اپ به جای صفحه‌ی خالی این پیام را نشان می‌دهد. اگر مشکل ادامه داشت، فایل‌های ساخت و اتصال برنامه باید بررسی شوند.</p><button id="vexa-reload" type="button" style="border:0;border-radius:12px;padding:12px 21px;background:#22c55e;color:#062210;font-weight:800;cursor:pointer">تلاش دوباره</button><p id="vexa-failure" style="color:#829586;font:11px Tahoma,sans-serif;line-height:1.8;overflow-wrap:anywhere;margin:18px 0 0"></p></section>';
          document.body.appendChild(screen);
          var detail = document.getElementById('vexa-failure');
          if (detail) detail.textContent = failure ? 'جزئیات: ' + failure : 'مشکل ممکن است از فایل‌های برنامه یا شبکه باشد.';
          document.getElementById('vexa-reload').onclick = function () { window.location.reload(); };
        }, 7000);
      })();
    </script>
  </body>
</html>
