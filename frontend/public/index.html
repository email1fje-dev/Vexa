<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b08" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Vexa؛ فضای گفت‌وگوی تو برای ارتباط با دوستات." />
    <meta name="application-name" content="Vexa" />
    <title>Vexa | فضای گفت‌وگوی تو</title>
    <script>
      (function () {
        try {
          var selected = localStorage.getItem('vexa-theme');
          if (selected === 'light' || selected === 'dark') document.documentElement.setAttribute('data-theme', selected);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <noscript><div style="margin:10vh auto;max-width:560px;padding:24px;text-align:center;font:16px Tahoma,sans-serif;line-height:2">برای اجرای Vexa، جاوااسکریپت مرورگر باید فعال باشد.</div></noscript>
    <div id="root"></div>
    <script id="vexa-text-translation">
      (function () {
        var exact = {
          "Welcome back!":"خوش برگشتی!","We're so excited to see you again!":"خوشحالیم که دوباره می‌بینیمت.",
          "EMAIL":"ایمیل","PASSWORD":"گذرواژه","USERNAME":"نام کاربری","Forgot your password?":"گذرواژه را فراموش کرده‌ای؟",
          "Login":"ورود","Register":"ثبت‌نام","Need an account?":"حساب کاربری نداری؟","Create an account":"ساخت حساب کاربری",
          "Continue":"ادامه","Already have an account?":"از قبل حساب کاربری داری؟","Friends":"دوستان","Direct Messages":"پیام‌های خصوصی",
          "Find or start a conversation":"پیدا کردن یا شروع گفت‌وگو","Add Friend":"افزودن دوست","Online":"آنلاین","All":"همه",
          "Pending":"در انتظار","Blocked":"مسدودشده","User Settings":"تنظیمات کاربر","My Account":"حساب من",
          "Profiles":"نمایه‌ها","Privacy & Safety":"حریم خصوصی و امنیت","Appearance":"ظاهر","Notifications":"اعلان‌ها",
          "Voice & Video":"صدا و تصویر","Language":"زبان","Log Out":"خروج از حساب","Logout":"خروج از حساب",
          "Edit Profile":"ویرایش نمایه","Save Changes":"ذخیره تغییرات","Cancel":"لغو","Search":"جست‌وجو",
          "Search...":"جست‌وجو...","Message":"پیام","Send":"ارسال","Today":"امروز","Yesterday":"دیروز",
          "Welcome to Discord":"به Vexa خوش آمدی","Something went wrong!":"مشکلی پیش آمد؛ دوباره تلاش کن.",
          "Incorrect email or password":"ایمیل یا گذرواژه نادرست است","Email already taken":"این ایمیل قبلاً ثبت شده است",
          "Email is required":"وارد کردن ایمیل الزامی است","Password is required":"وارد کردن گذرواژه الزامی است",
          "Username is required":"وارد کردن نام کاربری الزامی است","DIRECT MESSAGES":"پیام‌های خصوصی",
          "Active Now":"اکنون فعال","Text channels":"کانال‌های متنی","Delete Message":"حذف پیام",
          "Are you sure you want to delete this message?":"از حذف این پیام مطمئنی؟",
          "No servers in common":"سرور مشترکی ندارید","Remove friend":"حذف دوست","Server Owner":"مالک سرور",
          "ADD FRIEND":"افزودن دوست","Send Friend Request":"ارسال درخواست دوستی","Incoming Friend Request":"درخواست دوستی دریافتی",
          "Outgoing Friend Request":"درخواست دوستی ارسالی","Cancel request":"لغو درخواست","Mutual Servers":"سرورهای مشترک",
          "Mutual Friends":"دوستان مشترک","It's quiet for now...":"فعلاً خبری نیست...","Change Log":"گزارش تغییرات",
          "Change your username":"تغییر نام کاربری","PHONE NUMBER":"شماره تلفن","Authorized Apps":"برنامه‌های مجاز",
          "Activity Status":"وضعیت فعالیت","Streamer Mode":"حالت استریم","Text & Images":"متن و تصویر",
          "User Profile":"نمایه کاربر","BILLING SETTINGS":"تنظیمات پرداخت","APP SETTINGS":"تنظیمات برنامه",
          "ACTIVITY SETTINGS":"تنظیمات فعالیت","You haven't added a phone number yet.":"هنوز شماره تلفنی اضافه نکرده‌ای."
        };
        function changeText(node) {
          if (!node || !node.nodeValue) return;
          var raw = node.nodeValue, key = raw.trim();
          if (!key) return;
          if (Object.prototype.hasOwnProperty.call(exact, key)) node.nodeValue = raw.replace(key, exact[key]);
          else if (/discord/i.test(key)) node.nodeValue = raw.replace(/discord/gi, 'Vexa');
        }
        function translate() {
          var root = document.getElementById('root');
          if (!root) return;
          var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach(changeText);
          root.querySelectorAll('*').forEach(function (element) {
            ['placeholder','aria-label','title','alt'].forEach(function (key) {
              var value = element.getAttribute(key);
              if (!value) return;
              if (Object.prototype.hasOwnProperty.call(exact, value)) element.setAttribute(key, exact[value]);
              else if (/discord/i.test(value)) element.setAttribute(key, value.replace(/discord/gi, 'Vexa'));
            });
          });
        }
        var queued = false;
        function schedule() {
          if (queued) return;
          queued = true;
          window.requestAnimationFrame(function () { queued = false; translate(); });
        }
        var root = document.getElementById('root');
        if (root) new MutationObserver(schedule).observe(root, { childList: true, subtree: true, characterData: true });
        document.addEventListener('DOMContentLoaded', schedule);
        schedule();
      })();
    </script>
    <script id="vexa-chat-theme-toggle">
      (function () {
        var key = 'vexa-theme';
        function theme() {
          try { var saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') return saved; } catch (_) {}
          return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        }
        function setTheme(value) {
          document.documentElement.setAttribute('data-theme', value);
          try { localStorage.setItem(key, value); } catch (_) {}
          var button = document.getElementById('vexa-global-theme-toggle');
          if (button) {
            button.textContent = value === 'light' ? '☾' : '☀';
            button.setAttribute('aria-label', value === 'light' ? 'فعال کردن تم تیره' : 'فعال کردن تم روشن');
          }
        }
        function mount() {
          var root = document.getElementById('root');
          if (!root || !root.children.length) return;
          var isAuth = !!root.querySelector('.vexa-auth-shell');
          var button = document.getElementById('vexa-global-theme-toggle');
          if (isAuth) { if (button) button.remove(); return; }
          if (!button) {
            button = document.createElement('button');
            button.id = 'vexa-global-theme-toggle';
            button.type = 'button';
            button.title = 'تغییر پوسته';
            button.style.cssText = 'position:fixed;z-index:99999;left:14px;bottom:14px;width:44px;height:44px;border-radius:14px;border:1px solid var(--vexa-border,#294432);background:var(--vexa-panel,#101612);color:var(--vexa-green,#22c55e);box-shadow:0 8px 26px #0004;font-size:20px;cursor:pointer';
            button.addEventListener('click', function () { setTheme(theme() === 'light' ? 'dark' : 'light'); });
            document.body.appendChild(button);
          }
          setTheme(theme());
        }
        var root = document.getElementById('root');
        if (root) new MutationObserver(mount).observe(root, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', mount);
        window.setTimeout(mount, 500);
      })();
    </script>
    <script>
      (function () {
        var failure = '';
        window.addEventListener('error', function (event) {
          if (event && event.target && (event.target.src || event.target.href)) failure = 'بارگذاری یکی از فایل‌های برنامه ناموفق بود.';
          else if (event && event.message) failure = String(event.message).slice(0, 160);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          failure = String(event && event.reason && event.reason.message || 'خطای اجرای برنامه').slice(0, 160);
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && (root.children.length || (root.textContent || '').trim())) return;
          if (document.getElementById('vexa-load-recovery')) return;
          var screen = document.createElement('main');
          screen.id = 'vexa-load-recovery';
          screen.dir = 'rtl';
          screen.style.cssText = 'position:fixed;inset:0;z-index:999999;display:grid;place-items:center;box-sizing:border-box;padding:20px;background:#070b08;color:#f0f7f1;font:14px Tahoma,Arial,sans-serif';
          screen.innerHTML = '<section style="width:min(100%,440px);padding:32px 25px;border:1px solid #294432;border-radius:24px;background:#101912;box-shadow:0 24px 80px #0008;text-align:center"><div style="font-size:36px;font-weight:900;color:#4ade80;letter-spacing:-1px">Vexa</div><div style="width:48px;height:4px;margin:15px auto 20px;background:#22c55e;border-radius:8px"></div><h1 style="font-size:22px;margin:0 0 12px">صفحه درست بارگذاری نشد</h1><p style="color:#9cab9e;line-height:2;margin:0 0 18px">وب‌اپ به جای صفحه‌ی خالی این پیام را نشان می‌دهد. اگر مشکل ادامه داشت، فایل‌های ساخت و اتصال برنامه باید بررسی شوند.</p><button id="vexa-reload" type="button" style="border:0;border-radius:12px;padding:12px 21px;background:#22c55e;color:#062210;font-weight:800;cursor:pointer">تلاش دوباره</button><p id="vexa-failure" style="color:#829586;font:11px Tahoma,sans-serif;line-height:1.8;overflow-wrap:anywhere;margin:18px 0 0"></p></section>';
          document.body.appendChild(screen);
          var detail = document.getElementById('vexa-failure');
          if (detail) detail.textContent = failure ? 'جزئیات: ' + failure : 'مشکل ممکن است از فایل‌های برنامه یا شبکه باشد.';
          document.getElementById('vexa-reload').onclick = function () { window.location.reload(); };
        }, 7000);
      })();
    </script>
  </body>
</html>
